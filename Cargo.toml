[package]
name = "forced-alignment"
version = "0.2.3"
edition = "2024"

[lib]
name = "forced_alignment"
path = "src/lib.rs"

[[bin]]
name = "forced-alignment"
path = "src/main.rs"

[features]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dependencies]
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
clap = { version = "4", features = ["derive"] }
hf-hub = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.23"

# pin symphonia & rubato to 0.5 and 0.16
# Both symphonia 0.6 & rubato 3.0 are very recent rewrites with
# substantially different APIs
# (no SampleBuffer, no SincFixedIn at top level, etc.)
symphonia = { version = "0.5", features = ["mp3"] }
rubato = "0.16"
unicode-segmentation = "1"

# Exploratory: exposes CudaDevice::cuda_context()/from_context_and_stream()
# as pub, so multiple stream-bound devices can share one loaded model's
# context (weights copied cheaply GPU-to-GPU per stream, not reloaded from
# disk) instead of every concurrent align() call serializing on one shared
# stream. Not yet merged upstream.
[patch.crates-io]
candle-core = { git = "https://github.com/ultrasaurus/candle.git", branch = "expose-cuda-stream-context" }
